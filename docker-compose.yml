services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:4000/api/v1
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tendermind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tendermind_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tendermind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    ports:
      - "4000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./reports:/reports
      - ./data:/data
      - ./evaluation:/evaluation
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4173}
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./reports:/reports
      - ./data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
  redis_data:
